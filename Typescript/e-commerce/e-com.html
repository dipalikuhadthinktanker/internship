<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini E-Commerce</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="e-com.css" />
    <link rel="stylesheet" href="e-com-resp.css" />
  </head>
  <body>
    <div id="loader" class="loader"></div>
    <header class="header">
      <h1>Mini E-Shop</h1>
      <div class="actions">
        <div class="search-container">
          <i class="fa fa-search search-icon"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
          />
        </div>
        <div class="cart">
          <i class="fa fa-shopping-cart" aria-hidden="true" id="cartIcon"></i>
          <span id="cartCount">0</span>
          <div id="cartDropdown" class="cart-dropdown">
            <h4>My Cart</h4>
            <div id="cartItems"></div>
          </div>
        </div>
      </div>
    </header>
    <div class="container">
      <nav class="categories">
        <div class="nav-tab-cat">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="electronics">
            Electronics
          </button>
          <button class="category-btn" data-category="jewelery">
            Jewelery
          </button>
          <button class="category-btn" data-category="men's clothing">
            Men's
          </button>
          <button class="category-btn" data-category="women's clothing">
            Women's
          </button>
        </div>
        <div class="sort-container">
          <div class="sort-container">
            <select id="sortSelect" class="sort-select">
              <option value="none" selected disabled hidden>Sort by</option>
              <option value="priceLow">Price: Low → High</option>
              <option value="priceHigh">Price: High → Low</option>
              <option value="ratingHigh">Rating: High → Low</option>
              <option value="ratingLow">Rating: Low → High</option>
            </select>
          </div>
        </div>
      </nav>

      <main>
        <div id="productContainer" class="product-grid"></div>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>

    <script src="e-com.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  </body>
</html>
